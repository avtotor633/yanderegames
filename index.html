<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Yandere School 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading">
  <div class="load-box">
    <h1>Yandere School 3D</h1>
    <div class="bar"><div id="bar-fill"></div></div>
    <p id="load-text">Загрузка...</p>
  </div>
</div>

<div id="game-ui" class="hidden">
  <!-- Верхняя панель -->
  <div id="top-bar">
    <div class="pill" id="clock">08:00</div>
    <div class="pill" id="reputation">♡ Репутация: 50</div>
    <div class="pill" id="suspicion">👁 Подозрение: 0%</div>
  </div>
  <!-- Задание -->
  <div id="quest-box">
    <div class="q-title">Задание</div>
    <div id="quest-text">Найди Сэмпая во дворе</div>
  </div>
  <!-- Мини-карта -->
  <canvas id="minimap" width="140" height="140"></canvas>
  <!-- Журнал -->
  <div id="log-box"></div>

  <!-- Джойстик -->
  <div id="joystick"><div id="stick"></div></div>

  <!-- Правые кнопки -->
  <div id="right-controls">
    <button class="rbtn" id="btn-run">🏃</button>
    <button class="rbtn" id="btn-crouch">🕶</button>
    <button class="rbtn" id="btn-look">👁</button>
    <button class="rbtn" id="btn-laugh">😈</button>
    <button class="rbtn big" id="btn-interact">✋</button>
    <button class="rbtn" id="btn-pause">⏸</button>
  </div>

  <!-- Свайп камеры -->
  <div id="look-area"></div>

  <!-- Диалог -->
  <div id="dialog" class="hidden">
    <div id="dialog-name"></div>
    <div id="dialog-text"></div>
    <div id="dialog-buttons"></div>
  </div>

  <!-- Тревога -->
  <div id="alarm" class="hidden">🚨 ТРЕВОГА! Вызвана полиция! 🚨</div>
  <div id="police-timer" class="hidden"></div>

  <!-- Пауза -->
  <div id="pause-menu" class="hidden">
    <h2>Пауза</h2>
    <label>Чувствительность камеры <input type="range" id="sens" min="0.5" max="3" step="0.1" value="1.5"></label>
    <label>Громкость <input type="range" id="vol" min="0" max="1" step="0.1" value="0.6"></label>
    <label>Качество
      <select id="quality">
        <option value="low">Низкое</option>
        <option value="mid" selected>Среднее</option>
        <option value="high">Высокое</option>
      </select>
    </label>
    <label>Причёска
      <select id="hair">
        <option value="0">Длинные розовые</option>
        <option value="1">Хвостик</option>
        <option value="2">Короткие тёмные</option>
      </select>
    </label>
    <label>Форма
      <select id="outfit">
        <option value="0">Классическая</option>
        <option value="1">Спортивная</option>
      </select>
    </label>
    <button id="resume-btn">Продолжить</button>
  </div>

  <!-- Конец задания -->
  <div id="end-screen" class="hidden">
    <h2 id="end-title"></h2>
    <p id="end-text"></p>
    <button id="end-btn">ОК</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
